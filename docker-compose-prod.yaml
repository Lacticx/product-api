services:
  # Dịch vụ 1: Cơ sở dữ liệu MongoDB
  nammongodb:
    image: mongo:latest
    container_name: nammongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Dịch vụ 2: Ứng dụng Product API tải từ Docker Hub
  product-api:
    image: lacticx/product-api:latest
    container_name: namproductapi
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://nammongodb:27017/productdb
    depends_on:
      nammongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Dịch vụ 3: Watchtower - Tự động kéo Image mới từ Docker Hub và khởi động lại container
  watchtower:
    image: containrrr/watchtower:latest
    container_name: namwatchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Khắc phục lỗi tương thích phiên bản Docker API trên Docker Desktop mới nhất
      - DOCKER_API_VERSION=1.44
    # Quét Docker Hub mỗi 15 giây (--interval 15), xóa image cũ (--cleanup) 
    # và chỉ theo dõi cập nhật riêng container namproductapi
    command: --interval 15 --cleanup namproductapi
    restart: unless-stopped

volumes:
  mongo_data:
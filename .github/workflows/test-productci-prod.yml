name: Production CI-CD Pipeline with Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: CI (Test CRUD + Healthcheck trên Cloud)
  # ==========================================
  test-crud-with-mongodb:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Automated Healthcheck and CRUD Tests
        env:
          NODE_ENV: test
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb_test
        run: npm test

  # ==========================================
  # GIAI ĐOẠN 2: CD Bước 1 (Build & Push lên Docker Hub)
  # ==========================================
  cd-push-dockerhub:
    needs: test-crud-with-mongodb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Product API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:v1

  # ==========================================
  # GIAI ĐOẠN 3: CD Bước 2 (Tự động kéo từ Docker Hub về Local Docker Engine)
  # ==========================================
  deploy-to-local-docker:
    needs: cd-push-dockerhub
    # Chạy trực tiếp trên máy tính cá nhân của bạn thông qua Self-hosted Runner
    runs-on: self-hosted

    steps:
      - name: Checkout repository code to get docker-compose-prod.yaml
        uses: actions/checkout@v4

      - name: Pull latest image from Docker Hub and restart containers
        run: |
          docker compose -f docker-compose-prod.yaml pull
          docker compose -f docker-compose-prod.yaml up -d
          docker image prune -f
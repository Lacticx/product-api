services:
  # Dịch vụ 1: Cơ sở dữ liệu MongoDB
  nammongodb:
    image: mongo:latest
    container_name: nammongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Dịch vụ 2: Ứng dụng Product API
  product-api:
    build: .
    image: product-api:v1
    container_name: namproductapi
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://nammongodb:27017/productdb
    depends_on:
      nammongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data: